[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "time-series-storytelling"
version = "0.1.0"
description = "Evidence-grounded time-series story planning and deterministic code-to-video rendering"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "Pillow>=10"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
ts-story = "ts_story.cli:main"

[tool.setuptools]
packages = ["ts_story"]
