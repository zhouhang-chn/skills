name: Time-Series Storytelling

on:
  pull_request:
    paths:
      - 'time-series-storytelling/**'
      - '.github/workflows/time-series-storytelling-ci.yml'
  push:
    branches: [main]
    paths:
      - 'time-series-storytelling/**'
      - '.github/workflows/time-series-storytelling-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install -e './time-series-storytelling[test]'
      - name: Unit and regression tests
        run: python -m pytest -q time-series-storytelling/tests
      - name: End-to-end render smoke test
        run: |
          ffmpeg -version | head -1
          python -m ts_story run time-series-storytelling/examples/step_up.csv \
            --metric 'Active accounts' --unit accounts \
            --source 'Synthetic fixture' \
            --outdir /tmp/ts-story-smoke --size 320x180 --fps 8
          test -s /tmp/ts-story-smoke/story.json
          test -s /tmp/ts-story-smoke/film.mp4
